<!doctype html><meta charset="utf-8"><title>audio probe</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0d0b09; color: #b9ab92; font: 12px/1.4 ui-monospace, Menlo, monospace; padding: 12px; }
  canvas { display: block; width: 100%; max-width: 1200px; background: #070605; margin: 8px 0 2px; }
  h2 { color: #e2b866; font-size: 12px; margin: 14px 0 0; font-weight: 600; }
</style>
<div id="out"></div>
<script type="module">
// Spectral probe for the audio module: renders a scripted scene through the real engine in an
// OfflineAudioContext, then reports octave-band levels over time windows and draws a spectrogram.
// Driven by dev/audio-probe.mjs (window.probe(name) -> report). Scenes cover the phonograph, the
// keeper and clinging singers, alone and against the plate, so their balance can be read off.
import { createEngine } from '../src/audio/engine.js';
import { makeSnapshot } from '../src/audio/audio.js';
import { MODES, modeById } from '../src/sim/modes.js';

const SR = 48000;
const idx = (id) => modeById(id).index;
const sp = (id, ks, count, meanE = 0.7, cu = 0, cling = 0) => ({ id, ks, count, meanE, cu, aurata: id.endsWith('*'), cling });

const SCENES = {
  // the plate alone singing two modes (reference for the playback scenes)
  plate: [6, (t, s) => { s.amps[idx('2.4+')] = 0.4; s.amps[idx('1.3+')] = 0.27; s.total = 0.48; }],
  // the same two modes, now played back by the phonograph into the plate
  playback: [6, (t, s) => {
    const P = s.phono; P.motor = true; P.play = t > 0.5; P.amps.fill(0);
    if (P.play) { P.amps[idx('2.4+')] = 0.45; P.amps[idx('1.3+')] = 0.3; }
    s.amps[idx('2.4+')] = P.play ? 0.4 : 0; s.amps[idx('1.3+')] = P.play ? 0.27 : 0; s.total = 0.48;
  }],
  // playback machinery only (no modes): the bed and the motor
  bed: [5, (t, s) => { const P = s.phono; P.motor = true; P.play = t > 0.5; P.amps.fill(0); }],
  // recording machinery only: hiss and clockwork
  record: [5, (t, s) => { const P = s.phono; P.motor = true; P.rec = t > 0.5; P.amps.fill(0); }],
  keeper: [10, (t, s) => { const K = s.keeper; K.on = true; K.e = 0.95; K.cu = 0.5; }],
  keeperWithSingers: [10, (t, s) => {
    const K = s.keeper; K.on = true; K.e = 0.95; K.cu = 0.5;
    [sp('2.4+', [20], 5, 0.8, 0.3), sp('1.3+', [10], 3, 0.6, -0.4), sp('1.2+', [5], 3, 0.7)].forEach((x, i) => { s.species[i] = x; });
    s.nSpecies = 3;
  }],
  singers: [6, (t, s) => {
    [sp('2.4+', [20], 5, 0.8, 0.3), sp('1.3+', [10], 3, 0.6, -0.4), sp('1.2+', [5], 3, 0.7)].forEach((x, i) => { s.species[i] = x; });
    s.nSpecies = 3;
  }],
  clingOnly: [8, (t, s) => {
    const c = t > 2 && t < 6;
    [sp('2.4+', [20], 5, 0.8, 0.3, c ? 4 : 0), sp('1.3+', [10], 3, 0.6, -0.4, c ? 2 : 0)].forEach((x, i) => { s.species[i] = x; });
    s.nSpecies = 2; s.clingN = c ? 6 : 0;
  }],
  cling: [8, (t, s) => {
    const c = t > 2 && t < 6;
    [sp('2.4+', [20], 5, 0.8, 0.3, c ? 4 : 0), sp('1.3+', [10], 3, 0.6, -0.4, c ? 2 : 0), sp('1.2+', [5], 3, 0.7, 0, 0)].forEach((x, i) => { s.species[i] = x; });
    s.nSpecies = 3; s.clingN = c ? 6 : 0;
    s.amps[idx('2.4+')] = c ? 1.1 : 0.3; s.total = s.amps[idx('2.4+')];
  }],
};
const SHOTS = { keeperArrive: [12, { pan: -0.2 }], phonoNeedle: [1.5, { pan: 0.5 }], phonoStop: [1.5, { pan: 0.5 }] };

function fft(re, im) {
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = -2 * Math.PI / len, wr = Math.cos(ang), wi = Math.sin(ang);
    for (let i = 0; i < n; i += len) {
      let cr = 1, ci = 0;
      for (let k = 0; k < len / 2; k++) {
        const a = i + k, b = a + len / 2;
        const tr = re[b] * cr - im[b] * ci, ti = re[b] * ci + im[b] * cr;
        re[b] = re[a] - tr; im[b] = im[a] - ti; re[a] += tr; im[a] += ti;
        const nr = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = nr;
      }
    }
  }
}
const N = 8192, HANN = Float32Array.from({ length: N }, (_, i) => 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (N - 1)));
const BANDS = [27.5, 55, 110, 220, 440, 880, 1760, 3520, 7040, 14080];
const db = (x) => (x > 1e-10 ? 20 * Math.log10(x) : -200);

// octave-band power (dB, a full-scale sine reads about 0) averaged over [t0, t1)
function bands(buf, t0, t1) {
  const L = buf.getChannelData(0), R = buf.getChannelData(1);
  const acc = new Float64Array(BANDS.length - 1);
  let frames = 0, peakBins = [];
  const re = new Float32Array(N), im = new Float32Array(N), spec = new Float64Array(N / 2);
  for (let s = Math.floor(t0 * SR); s + N <= Math.min(L.length, t1 * SR); s += N / 2) {
    for (let i = 0; i < N; i++) { re[i] = (L[s + i] + R[s + i]) * 0.5 * HANN[i]; im[i] = 0; }
    fft(re, im);
    for (let k = 1; k < N / 2; k++) {
      const m = (re[k] * re[k] + im[k] * im[k]) / ((N / 4) * (N / 4));
      spec[k] += m;
      const f = k * SR / N;
      for (let b = 0; b < BANDS.length - 1; b++) if (f >= BANDS[b] && f < BANDS[b + 1]) { acc[b] += m; break; }
    }
    frames++;
  }
  // strongest spectral peaks (tonal content)
  for (let k = 2; k < N / 2 - 1; k++) if (spec[k] > spec[k - 1] && spec[k] >= spec[k + 1]) peakBins.push(k);
  peakBins.sort((a, b) => spec[b] - spec[a]);
  const peaks = peakBins.slice(0, 10).map((k) => [Math.round(k * SR / N), +(10 * Math.log10(spec[k] / Math.max(1, frames))).toFixed(1)]);
  const out = {};
  for (let b = 0; b < acc.length; b++) out[`${BANDS[b]}`] = +(10 * Math.log10(acc[b] / Math.max(1, frames) + 1e-20)).toFixed(1);
  return { bands: out, peaks };
}
// amplitude-modulation depth at the given rates (envelope of 4 ms RMS frames, single-bin DFT)
function modulation(buf, t0, t1, rates = [0.31, 2.67, 4.3, 5.6, 10.5]) {
  const L = buf.getChannelData(0), R = buf.getChannelData(1), F = Math.round(0.004 * SR);
  const env = [];
  for (let s = Math.floor(t0 * SR); s + F <= Math.min(L.length, t1 * SR); s += F) {
    let e = 0; for (let i = s; i < s + F; i++) e += L[i] * L[i] + R[i] * R[i];
    env.push(Math.sqrt(e / (2 * F)));
  }
  const mean = env.reduce((a, b) => a + b, 0) / Math.max(1, env.length);
  const out = {};
  for (const r of rates) {
    let c = 0, si = 0;
    for (let i = 0; i < env.length; i++) { const ph = 2 * Math.PI * r * i * F / SR; c += (env[i] - mean) * Math.cos(ph); si += (env[i] - mean) * Math.sin(ph); }
    out[r] = +(2 * Math.hypot(c, si) / Math.max(1, env.length) / Math.max(1e-9, mean)).toFixed(3);
  }
  return out;
}
function level(buf, t0, t1) {
  const L = buf.getChannelData(0), R = buf.getChannelData(1);
  let e = 0, p = 0, c = 0;
  for (let i = Math.floor(t0 * SR); i < Math.min(L.length, t1 * SR); i++) { e += L[i] * L[i] + R[i] * R[i]; p = Math.max(p, Math.abs(L[i]), Math.abs(R[i])); c++; }
  return { rms: +db(Math.sqrt(e / (2 * Math.max(1, c)))).toFixed(1), peak: +db(p).toFixed(1) };
}

async function renderScene(dur, script, step = 1 / 60) {
  const oc = new OfflineAudioContext(2, Math.round(SR * dur), SR);
  const E = createEngine(oc, { fadeIn: 0 });
  E.start(0, 0, false);
  const snap = makeSnapshot();
  let t = 0;
  const tick = () => {
    const now = oc.currentTime;
    const dt = now - t; t = now;
    snap.amps.fill(0); snap.nSpecies = 0;
    script(now, snap, E, dt);
    E.frame(snap, dt || step, now);
    const next = now + step;
    if (next < dur - step) oc.suspend(next).then(tick);
    oc.resume();
  };
  oc.suspend(step).then(tick);
  E.frame(snap, step, 0);
  return { buf: await oc.startRendering(), E };
}
async function renderShot(name, p, dur) {
  const oc = new OfflineAudioContext(2, Math.round(SR * dur), SR);
  const E = createEngine(oc, { fadeIn: 0 });
  E.start(0, 0, false);
  E.play(name, { ...p }, 0.05);
  E.frame(makeSnapshot(), 1 / 60, 0);
  return { buf: await oc.startRendering(), E };
}

function spectrogram(title, buf) {
  const h2 = document.createElement('h2'); h2.textContent = title; document.getElementById('out').appendChild(h2);
  const c = document.createElement('canvas'); c.width = 1200; c.height = 300; document.getElementById('out').appendChild(c);
  const g = c.getContext('2d'), w = c.width, H = c.height;
  const L = buf.getChannelData(0), R = buf.getChannelData(1), n = L.length, M = 4096;
  const win = Float32Array.from({ length: M }, (_, i) => 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (M - 1)));
  const re = new Float32Array(M), im = new Float32Array(M), img = g.createImageData(w, H);
  const fLo = 40, fHi = 9000, lg = Math.log(fHi / fLo);
  for (let x = 0; x < w; x++) {
    const s = Math.floor(x * (n - M) / w);
    for (let i = 0; i < M; i++) { re[i] = (L[s + i] + R[s + i]) * 0.5 * win[i]; im[i] = 0; }
    fft(re, im);
    for (let y = 0; y < H; y++) {
      const f = fLo * Math.exp((1 - y / H) * lg), k = Math.min(M / 2 - 1, Math.round(f * M / SR));
      const v = Math.max(0, Math.min(1, (db(Math.hypot(re[k], im[k]) / (M / 4)) + 100) / 80));
      const o = (y * w + x) * 4;
      img.data[o] = 255 * Math.min(1, v * 1.5); img.data[o + 1] = 210 * v * v; img.data[o + 2] = 90 * v * v * v + 20 * v; img.data[o + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  g.fillStyle = '#b9ab92'; g.font = '11px monospace';
  for (const f of [55, 110, 220, 440, 880, 1760, 3520, 7040]) { const y = (1 - Math.log(f / fLo) / lg) * H; g.fillRect(0, y, 8, 1); g.fillText(f, 10, y + 4); }
}

window.probe = async (name, windows) => {
  let r;
  if (SCENES[name]) r = await renderScene(SCENES[name][0], SCENES[name][1]);
  else if (SHOTS[name]) r = await renderShot(name, SHOTS[name][1], SHOTS[name][0]);
  else throw new Error('no scene ' + name);
  spectrogram(name, r.buf);
  const dur = r.buf.length / SR;
  const ws = windows || [[0.5, dur]];
  return { name, dur, nodes: r.E.nodes, windows: ws.map(([a, b]) => ({ t: [a, b], ...level(r.buf, a, b), ...bands(r.buf, a, b), mod: modulation(r.buf, a, b) })) };
};
window.ready = true;
</script>
